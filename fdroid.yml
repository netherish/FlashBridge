Description: |
  FlashBridge turns an Android phone with OTG support into a firmware utility
  for devices you own or are authorised to modify. It implements the fastboot
  and ADB protocols directly in Kotlin over the Android USB Host API.

  Features include a multi-image flash queue with per-partition targets and
  SHA-256 checksums, temporary boot, getvar all, A/B slot switching, factory
  reset, sideload and push, shell access, reboot targets, and an Advanced mode
  for erase/format/wipe/unlock/raw commands.

  No root, no bundled binaries, no bundled firmware and no vendor exploits.
  Every destructive action shows an exact-operation confirmation. Standard
  and advanced operations are clearly separated.

