MaintainerNotes: |
  This is a fastboot/ADB firmware utility for devices the user owns or is
  authorised to modify. It requires no root and bundles no binaries or
  firmware. Destructive operations are gated behind an in-app Advanced switch
  and always show an exact-operation confirmation dialog.

  The `full` flavor is the F-Droid build. The `play` flavor is a restricted
  variant with advanced operations compiled out and is not needed here.

  Name, summary, full description, changelog and screenshots are supplied in
  the source repository under fastlane/metadata/android/en-US/.

